---
name: Build

# Pull-request check only. Nothing is published from this workflow: production
# images are built by hand from deploy/postdelegate/Dockerfile.release.
on:
  pull_request:
    paths-ignore:
      - deploy/**
      - site/**
      - '**/*.md'
      - .github/workflows/uptime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        # the jest suite never ran in CI before; a failing spec now blocks the PR
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec jest --ci --forceExit

      - name: Build
        # the default Node heap runs out building the backend; the release
        # image builds with 3 GB (deploy/postdelegate/Dockerfile.release)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build
